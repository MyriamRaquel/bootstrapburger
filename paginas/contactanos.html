      crossorigin="anonymous"
  />
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg formatoheader">
      <img src="../imagenes/openclipart-vectors-hamburger-576419_1920.png" alt="Es una imagen de hamburguesa"> 
      <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html#elegitumenu">Pedi y Retira</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./delivery.html">Delivery</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="./sobrenosotros.html">Sobre Nosotros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./contactanos.html">Contactanos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <h2 class="text-center">Complete los siguientes datos para contactarnos</h2>
      <section class="d-flex justify-content-center my-5">
        <form>
          <div class="mb-3">
            <label for="exampleInputUser1" class="form-label"
              >Correo Usuario</label
            >
            <input
              type="email"
              class="form-control"
              id="exampleInputUser1"
              aria-describedby="emailHelp"
              required
              minlength="5"
              maxlength="30"
            />
          </div>
          <label for="exampleInputUser1" class="form-label"
            >Deja tu consulta:
          </label>
          <div class="form-floating">
            <textarea
              class="form-control"
              placeholder="Leave a comment here"
              id="floatingTextarea"
              required
            ></textarea>
            <label for="floatingTextarea">Mensaje...</label>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary boton-reg w-75 mt-3">
              Enviar Mensaje
            </button>
          </div>
        </form>
      </section>
    </main>
    <footer>
    <footer class="formatoheader">
        <div>
          <img src="../imagenes/logo.jpg" alt="Es una imagen de hamburguesa" 
          />
          &copy; BURGER KING
        </div>
  </footer>
  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
